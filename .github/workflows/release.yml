name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go version
        run: go version

      - name: Download GoReleaser
        run: |
          curl -sL "https://github.com/goreleaser/goreleaser/releases/download/v2.15.4/goreleaser_Linux_x86_64.tar.gz" -o /tmp/goreleaser.tar.gz
          tar -xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser
          goreleaser --version
