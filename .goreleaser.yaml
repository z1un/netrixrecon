version: 2
before:
  hooks: []
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
archives:
  - formats: zip
    files:
      - LICENSE
checksum:
  name_template: "checksums.txt"
release:
  mode: replace
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
